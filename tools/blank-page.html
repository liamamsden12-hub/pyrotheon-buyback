<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Pyrotheon Industries</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* New members page. Everything in this file is encrypted before it is published.
   {{name}} is replaced with the signed-in member's display name. */
:root {
  --bg: #070c14; --panel: #0d1624; --line: #1d2d44;
  --ink: #e6eef8; --ink-2: #9fb2c8; --ink-3: #6a7f98; --ice: #7cc8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 36px 20px 48px; display: grid; gap: 28px; }
h1 { font-family: "Chakra Petch", sans-serif; font-size: clamp(26px, 4vw, 36px); font-weight: 700; margin: 0; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 48px 24px; text-align: center; display: grid; gap: 6px; background: var(--panel); }
.empty strong { font-family: "Chakra Petch", sans-serif; font-size: 18px; font-weight: 600; }
.empty p { margin: 0; color: var(--ink-2); }
</style>
</head>
<body>
<main class="wrap">
  <h1>{{title}}</h1>
  <div class="empty">
    <strong>This page is being built.</strong>
    <p>Check back soon.</p>
  </div>
</main>
</body>
</html>
